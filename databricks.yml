# Databricks Asset Bundle: FDE Interview Packet -- Theater Sales Pipeline
#
# Two jobs power the as-is architecture:
#   1. seed_theater_data -- loads the three bundled CSVs into bronze Delta tables
#   2. build_denormalized_theater_sales -- inner-joins the bronze tables into the
#      denormalized table that powers the Theater Performance dashboard
#
# Default workspace init:
#   databricks bundle deploy -t dev
#   databricks bundle run    -t dev seed_theater_data
#   databricks bundle run    -t dev build_denormalized_theater_sales
#
# Gold application setup (separate from the legacy dashboard path above):
#   seed theater_analytics.bronze, then run build_silver_theater_data and
#   build_gold_theater_data. Create decision_feedback and grant app access
#   using the owner-run notebooks documented in SETUP.md.
# Deploy updated Gradio code/config and launch it:
#   databricks bundle deploy -t dev --profile my-profile --select apps.reel_insights_app
#   databricks bundle run -t dev --profile my-profile reel_insights_app
#
# Default catalog is workspace (Unity Catalog).

bundle:
  name: fde_theater
  databricks_cli_version: ">= 0.260.0"

include:
  - resources/dashboards.yml
  - resources/jobs.yml
  - resources/apps.yml

sync:
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"

variables:
  catalog:
    description: "Catalog where bronze + denormalized tables are written."
    default: workspace
  schema:
    description: "Schema where bronze + denormalized tables are written."
    default: fde_theater
  warehouse_id:
    description: "SQL warehouse ID used by the dashboards and app. Defaults to the Serverless Starter Warehouse present in fresh workspaces; override with --var=\"warehouse_id=<id>\" if it has been renamed or deleted."
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/saibharathparsam@outlook.com/fde_interview
    run_as:
      user_name: saibharathparsam@outlook.com
