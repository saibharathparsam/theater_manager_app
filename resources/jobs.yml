# Jobs: seed_theater_data -> build_denormalized_theater_sales is the default init path.
# Serverless compute: job environments with environment_version 5 (latest serverless
# environment; required for Databricks Free Edition, which only supports serverless).
#
# Within seed_theater_data, ingest_pos_ticket_sales depends on the other two ingest
# tasks because POS reads theater_layout and imdb_movie_metadata for FK consistency.
resources:
  jobs:
    seed_theater_data:
      name: "Seed Theater Data"
      description: >-
        Generates the three source datasets (theater layout, IMDB movie metadata,
        POS ticket sales) deterministically and writes them to the configured
        catalog/schema. POS data has seeded DQ issues clustered by POS system;
        theater layout and movie metadata are clean.
      tags:
        purpose: fde_interview_packet
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: ingest_theater_layout
          description: Generate and write the theater_layout table.
          spark_python_task:
            python_file: ../src/ingest/ingest_theater_layout.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
          environment_key: default

        - task_key: ingest_imdb_metadata
          description: Generate and write the imdb_movie_metadata table.
          spark_python_task:
            python_file: ../src/ingest/ingest_imdb_metadata.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
          environment_key: default

        - task_key: ingest_pos_ticket_sales
          description: >-
            Generate and write the pos_ticket_sales table. Reads theater_layout
            and imdb_movie_metadata for FK-consistent transactions before DQ
            injection.
          depends_on:
            - task_key: ingest_theater_layout
            - task_key: ingest_imdb_metadata
          spark_python_task:
            python_file: ../src/ingest/ingest_pos_ticket_sales.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
          environment_key: default
      environments: &fde_serverless_env
        - environment_key: default
          spec:
            environment_version: "5"

    build_silver_theater_data:
      name: "Build Silver Theater Data"
      description: >-
        Loads theater_analytics.silver from theater_analytics.bronze using the
        three source Silver notebooks, then builds the combined Silver dataset.
        Full-refreshes theater layout and IMDB metadata; incrementally merges POS
        ticket sales and denormalized theater sales. Run after seeding Bronze.
        Processes operator correction requests after POS ingestion; applied recoveries
        automatically refresh Gold and complete their audit status.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tags:
        purpose: fde_interview_packet
      tasks:
        - task_key: build_silver_theater_layout
          description: Copy the Bronze theater layout snapshot into Silver.
          notebook_task:
            notebook_path: ../src/notebooks/build_silver_theater_layout.py
            source: WORKSPACE

        - task_key: build_silver_imdb_metadata
          description: Refresh Silver movie metadata with release_date as DATE.
          notebook_task:
            notebook_path: ../src/notebooks/build_silver_imdb_metadata.py
            source: WORKSPACE

        - task_key: build_silver_pos_ticket_sales
          description: Load normal POS sales, then validate and restore queued operator corrections.
          max_retries: 2
          min_retry_interval_millis: 10000
          depends_on:
            - task_key: build_silver_theater_layout
            - task_key: build_silver_imdb_metadata
          notebook_task:
            notebook_path: ../src/notebooks/process_quarantine_recovery.py
            source: WORKSPACE

        - task_key: has_applied_recoveries
          depends_on:
            - task_key: build_silver_pos_ticket_sales
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.build_silver_pos_ticket_sales.values.recovery_applied}}"
            right: "true"

        - task_key: refresh_gold_after_recovery
          max_retries: 2
          min_retry_interval_millis: 10000
          depends_on:
            - task_key: build_silver_denormalized_theater_sales
            - task_key: has_applied_recoveries
              outcome: "true"
          notebook_task:
            notebook_path: ../src/notebooks/build_gold_theater_daily_sales.py
            source: WORKSPACE

        - task_key: complete_quarantine_recovery
          max_retries: 2
          min_retry_interval_millis: 10000
          depends_on:
            - task_key: refresh_gold_after_recovery
          notebook_task:
            notebook_path: ../src/notebooks/complete_quarantine_recovery.py
            source: WORKSPACE

        - task_key: build_silver_denormalized_theater_sales
          description: Left-join all Silver sources and incrementally merge the Gold-ready dataset.
          max_retries: 2
          min_retry_interval_millis: 10000
          depends_on:
            - task_key: build_silver_theater_layout
            - task_key: build_silver_imdb_metadata
            - task_key: build_silver_pos_ticket_sales
          notebook_task:
            notebook_path: ../src/notebooks/build_silver_denormalized_theater_sales.py
            source: WORKSPACE

    build_gold_theater_data:
      name: "Build Gold Theater Data"
      description: >-
        Full-refreshes theater_analytics.gold.theater_daily_sales by aggregating
        Silver POS sales before left-joining Silver theater layout and IMDB
        metadata. Run after the Silver job succeeds; operating hours use portable HH:mm:ss strings.
      max_concurrent_runs: 1
      tags:
        purpose: fde_interview_packet
      tasks:
        - task_key: build_gold_theater_daily_sales
          description: Aggregate daily sales and enrich with Silver reference attributes.
          notebook_task:
            notebook_path: ../src/notebooks/build_gold_theater_daily_sales.py
            source: WORKSPACE

    build_denormalized_theater_sales:
      name: "Build Denormalized Theater Sales"
      description: >-
        Inner-joins the three source tables into the denormalized_theater_sales
        table that powers the Theater Performance dashboard. Run after
        seed_theater_data.
      tags:
        purpose: fde_interview_packet
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: build_denormalized_theater_sales
          description: Build the denormalized theater sales table from the source tables.
          spark_python_task:
            python_file: ../src/transform/build_denormalized_theater_sales.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
          environment_key: default
      environments: *fde_serverless_env
